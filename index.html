<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nogal — Muebles de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --stage:#E7EAE3; --stage-2:#DDE1D8; --ink:#1A1A1A; --muted:#626963; --line:#DCE0D9;
  --green:#1E3A2F; --green-2:#2A4A3C; --butter:#F0CF5C;
  --accent:#1E3A2F; --accent-d:#13271F; --olive:#1E3A2F; --soft:#E7EAE3;
  --ok:#2F7A4A; --warn:#9A630F; --err:#B3261E; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Poppins,system-ui,sans-serif;font-weight:600;font-stretch:80%;letter-spacing:-.025em;line-height:1.1;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}
.price,.tot,.kpi b,.qty span{font-variant-numeric:tabular-nums}

/* header */
.topbar{background:var(--green);color:#E4EAE5;font-size:14px;text-align:center;padding:8px 12px}
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-size:26px;font-weight:600;font-stretch:75%;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
nav.main{display:flex;gap:4px;margin-left:24px}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:999px;font-size:16px;color:var(--muted)}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);background:var(--stage)}
.hspace{flex:1}
.iconbtn{position:relative;width:42px;height:42px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--stage)}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--butter);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center}
.menu-btn{display:none}
@media (max-width:767.98px){nav.main{display:none}.menu-btn{display:grid}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:12px 24px;font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn-p,.btn-a{background:var(--green);color:#fff}
.btn-p:hover,.btn-a:hover{background:var(--accent-d)}
.btn-o{background:transparent;border-color:var(--ink)}
.btn-o:hover{background:var(--ink);color:#fff}
.btn-g{background:#fff;border-color:var(--line)}
.btn-g:hover{border-color:var(--ink)}
.btn-wa{background:#1F8F4E;color:#fff}
.btn-wa:hover{background:#17773f}
.btn-light{background:#fff;color:var(--green)}
.btn-light:hover{background:var(--butter)}
.btn-sm{padding:8px 16px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:16px}
.link:hover{color:var(--ink)}

/* hero */
.hero{margin-top:24px;background:var(--green);color:#fff;border-radius:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);overflow:hidden;position:relative}
.hero-copy{padding:56px 48px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.hero h1{font-size:clamp(48px,7.6vw,108px);font-weight:600;font-stretch:75%;line-height:1.1;letter-spacing:-.035em;max-width:9ch}
.hero p{font-size:18px;color:#C9D6CE;max-width:36ch;margin:0 0 24px}
.hero-stage{position:relative;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 32px 24px;gap:24px}
#herostage{flex:1;position:relative;min-height:240px}
#herostage svg,#herostage img{position:absolute;inset:0;width:100%;height:100%}
.hero-pick{position:relative;background:#fff;color:var(--ink);border-radius:20px;padding:16px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-pick .nm{flex:1;min-width:140px}
.hero-pick .nm b{display:block;font-size:16px}
.hero-pick .nm span{font-size:14px;color:var(--muted)}
.hsw{display:flex;gap:8px}
.hsw button{width:30px;height:30px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.hsw button.on{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:767.98px){.hero{grid-template-columns:1fr;border-radius:24px}.hero-copy{padding:32px 24px 0;gap:16px;justify-content:flex-start}.hero-stage{min-height:0;padding:12px 12px 12px}#herostage{min-height:190px}}

.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:40px 0 8px}
.perk{display:flex;gap:12px;align-items:flex-start}
.perk svg{flex:none;width:24px;height:24px;color:var(--green)}
.perk b{display:block;font-weight:600;font-size:16px}
.perk span{font-size:14px;color:var(--muted)}
@media (max-width:767.98px){.perks{grid-template-columns:1fr 1fr;gap:16px}}

.sec{padding:48px 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:24px}
.sec-h h2{font-size:clamp(30px,4.4vw,48px)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat{background:var(--stage);border-radius:24px;text-decoration:none;overflow:hidden;position:relative;aspect-ratio:3/3.6;display:block}
.cat .ca{position:absolute;inset:0}
.cat .ca svg{width:100%;height:100%}
.cat b{position:absolute;left:14px;bottom:12px;font-weight:600;font-size:16px}
.cat:hover{background:var(--stage-2)}
@media (max-width:767.98px){.cats{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}.cats::-webkit-scrollbar{display:none}.cat{flex:0 0 42%}}

/* grid & product cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 16px}
@media (max-width:767.98px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:767.98px){.grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}}
.grid>*{min-width:0}
.card{display:flex;flex-direction:column;position:relative;min-width:0}
.card .media{aspect-ratio:1/1;background:var(--stage);display:block;position:relative;border-radius:var(--r);overflow:hidden}
.card .media svg,.card .media img{width:100%;height:100%;object-fit:cover}
@media (hover:hover){.card:hover .media{background:var(--stage-2)}}
.card .body{padding:12px 4px 0;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:600;text-decoration:none;line-height:1.25;font-size:16px}
.card .mt{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.price b{font-weight:600;font-size:16px}
.price s{color:var(--muted);font-size:14px}
.plus{position:absolute;right:10px;bottom:10px;z-index:2;width:42px;height:42px;border-radius:999px;border:0;background:var(--green);color:#fff;display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.plus:hover{background:var(--accent-d)}
.plus[disabled]{display:none}
.tag{position:absolute;top:10px;left:10px;background:var(--butter);color:var(--ink);font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;z-index:2}
.tag.out{background:var(--ink);color:#fff}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center}
.fav svg{width:19px;height:19px}
.fav.on svg{fill:var(--green);stroke:var(--green)}
.swatches{display:flex;gap:4px;margin-top:8px}
.sw{width:14px;height:14px;border-radius:999px;border:1px solid rgba(0,0,0,.12);display:inline-block}

/* shop */
.shop-head{padding:32px 0 8px}
.shop-head h1{font-size:clamp(40px,6vw,72px);font-weight:600;font-stretch:75%}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 16px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--stage);border-radius:999px;padding:0 16px;height:46px}
.search input{border:0;background:transparent;outline:0;flex:1;height:100%}
.search:focus-within{box-shadow:0 0 0 2px var(--green)}
.search svg{width:18px;height:18px;color:var(--muted)}
.sel{height:46px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 16px}
@media (max-width:767.98px){.filters .search{flex-basis:100%}.filters .sel{flex:1 1 0;min-width:0;font-size:14px;padding:0 8px;height:42px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.empty{text-align:center;padding:64px 24px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:30px;margin-bottom:8px}

/* product page */
.crumbs{font-size:14px;color:var(--muted);padding:24px 0 4px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.pd{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;padding:12px 0 32px;align-items:start}
@media (max-width:767.98px){.pd{grid-template-columns:1fr;gap:24px}}
.pd-media{background:var(--stage);border-radius:28px;overflow:hidden;aspect-ratio:1/1;position:relative}
@media (min-width:768px){.pd-media{position:sticky;top:84px}}
.pd-media svg,.pd-media img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(36px,4.6vw,60px);font-weight:600;font-stretch:75%;line-height:1.1;margin:8px 0 16px}
.pd .price b{font-size:28px}
.pd .price s{font-size:18px}
.eyebrow{font-size:16px;color:var(--muted)}
.save{background:var(--butter);color:var(--ink);font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px}
.stock{font-size:14px;display:flex;align-items:center;gap:8px;margin:12px 0 24px}
.dot{width:8px;height:8px;border-radius:9px;background:var(--ok)}
.dot.low{background:var(--warn)}.dot.out{background:var(--err)}
.opt-l{font-size:14px;font-weight:600;margin:16px 0 12px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px 4px 4px;font-size:14px}
.cbtn .sw{width:24px;height:24px}
.cbtn.on{border-color:var(--ink)}
.buy{display:flex;gap:12px;margin:24px 0 12px}
.buy .btn{flex:1;padding:16px 24px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:#fff;height:50px}
.qty button{width:42px;height:100%;border:0;background:transparent;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:600}
.qty.sm{height:36px}.qty.sm button{width:32px;font-size:16px}
.specs{margin-top:24px;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.specs span{color:var(--muted)}
.specs b{font-weight:500;text-align:right}
.desc{color:#3d423e;margin-top:24px;white-space:pre-line;max-width:60ch}
.assure{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.assure div{background:var(--stage);border-radius:16px;padding:12px 16px;font-size:14px}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(20,30,25,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:61;transform:translateX(100%);visibility:hidden;transition:transform .15s cubic-bezier(.7,0,.84,0),visibility 0s linear .15s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.16,1,.3,1),visibility 0s}
.drawer.left{left:0;right:auto;transform:translateX(-100%)}
.drawer.left.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
.dh h3{font-size:28px}
.db{flex:1;overflow:auto;padding:8px 24px}
.df{border-top:1px solid var(--line);padding:16px 24px}
.ci{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci .th{width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--stage)}
.ci .th svg,.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .r1{display:flex;justify-content:space-between;gap:8px}
.ci .r2{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.tot{display:flex;justify-content:space-between;font-size:16px;margin:4px 0}
.tot.big{font-size:20px;font-weight:600;margin-top:12px}
.tot.disc{color:var(--ok)}
.progress{height:6px;background:var(--stage);border-radius:9px;overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:var(--green)}
.mnav a{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:22px;font-weight:600;font-stretch:85%}

/* checkout */
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;padding:24px 0 40px;align-items:start}
@media (max-width:767.98px){.co{grid-template-columns:1fr}}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:24px}
.panel h3{font-size:24px;margin-bottom:16px}
.panel+.panel{margin-top:16px}
aside .panel{background:var(--stage);border-color:var(--stage)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg .full{grid-column:1/-1}
@media (max-width:767.98px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 12px;font-size:16px;font-weight:400;outline:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--green)}
label.f.bad input,label.f.bad select{border-color:var(--err)}
label.f .er{color:var(--err);font-size:14px;font-weight:500}
.radios{display:grid;gap:12px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fff;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--green)}
.radio.on{border-color:var(--green);background:#F4F6F2}
.radio b{display:block;font-weight:600;font-size:16px}
.radio span{font-size:14px;color:var(--muted)}
.radio em{margin-left:auto;font-style:normal;font-weight:600;font-size:14px}
.sumi{display:flex;gap:12px;align-items:center;padding:8px 0}
.sumi .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:#fff;flex:none}
.sumi .th svg,.sumi .th img{width:100%;height:100%;object-fit:cover}
.sumi .n{flex:1;font-size:14px;line-height:1.3}
.coupon{display:flex;gap:8px;margin:16px 0}
.coupon input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:#fff;text-transform:uppercase}

/* success */
.ok-hero{text-align:center;padding:48px 0 12px}
.ok-hero .ic{width:68px;height:68px;border-radius:99px;background:var(--butter);color:var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.ok-hero h1{font-size:clamp(40px,6vw,64px);font-weight:600;font-stretch:75%}
.ok-hero p{font-size:18px}
.note{background:#FBF2CF;border-radius:16px;padding:16px 16px;font-size:16px}
.note.info{background:var(--stage)}
pre.bank{white-space:pre-wrap;font:inherit;margin:8px 0 0}

/* orders */
.ord{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.ord-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.st,.paid,.unpaid{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--stage)}
.st-nuevo{background:var(--butter);color:var(--ink)}
.st-confirmado{background:#DCE6F5;color:#2D4C80}
.st-enviado{background:#E8E1F4;color:#553D86}
.st-entregado{background:#D8EBDD;color:var(--ok)}
.st-cancelado{background:#ECECEC;color:#6c6c6c}
.paid{background:#D8EBDD;color:var(--ok)}
.unpaid{background:#FBF2CF;color:var(--warn)}

/* admin */
.adm-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:24px 0 8px}
.adm-h h1{font-size:44px;font-weight:600;font-stretch:75%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 24px;scrollbar-width:none;background:var(--stage);padding:4px;border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:767.98px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--stage);border-radius:20px;padding:16px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{display:block;font-weight:600;font-stretch:80%;font-size:34px;letter-spacing:-.02em;margin-top:8px}
.kpi:first-child{background:var(--green);color:#fff}.kpi:first-child span{color:#C9D6CE}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);font-size:16px;vertical-align:middle}
.tbl th{font-size:14px;color:var(--muted);font-weight:600}
.tbl .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--stage)}
.tbl .th svg,.tbl .th img{width:100%;height:100%;object-fit:cover}
.tblwrap{overflow-x:auto}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.minisel{border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:767.98px){.two{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:12px;font-size:14px;margin:12px 0}
.bar i{display:block;height:8px;border-radius:9px;background:var(--green)}
.bar .bw{flex:1;background:var(--stage);border-radius:9px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,30,25,.45)}
.modal .box{background:#fff;border-radius:24px;width:min(660px,100%);max-height:92vh;overflow:auto;padding:24px}
.modal .box.sm{width:min(400px,100%)}
.modal h3{font-size:30px;margin-bottom:16px}
.colrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.colrow input[type=text]{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.colrow input[type=color]{width:44px;height:40px;border:1.5px solid var(--line);border-radius:12px;padding:4px;background:#fff}
.imgprev{width:120px;height:120px;border-radius:14px;overflow:hidden;background:var(--stage)}
.imgprev svg,.imgprev img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font-size:16px}
.chk input{accent-color:var(--green)}

/* footer, toast */
footer.site{background:var(--green);color:#C9D6CE;margin-top:64px;padding:48px 0 24px;font-size:16px}
footer .fbrand{font-size:clamp(56px,10vw,140px);font-weight:600;font-stretch:75%;letter-spacing:-.04em;line-height:1.1;color:#fff;margin:0 0 40px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
@media (max-width:767.98px){footer .cols{grid-template-columns:1fr 1fr}}
footer h4{color:#fff;font-weight:600;font-size:16px;margin:0 0 12px}
footer a{display:block;text-decoration:none;color:#C9D6CE;padding:4px 0}
footer a:hover{color:#fff}
footer .bottom{border-top:1px solid rgba(255,255,255,.15);margin-top:32px;padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:#9FB2A6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:16px;z-index:90;opacity:0;transition:opacity .2s ease-out,transform .2s ease-out;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.sysnote{font-size:14px;padding:8px 12px;text-align:center;background:#FBF2CF}
.sticky-buy{display:none}
@media (max-width:767.98px){.sticky-buy{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);padding:12px 16px;gap:12px;align-items:center}.sticky-buy .btn{flex:1}body.has-sticky{padding-bottom:72px}}

/* --- audit: hit targets 44px --- */
.iconbtn{width:44px;height:44px}
.fav,.plus{width:44px;height:44px}
.btn,.chip,.cbtn,.minisel,.tabs button{min-height:44px}
.chip{display:inline-flex;align-items:center}
.link{min-height:44px;display:inline-flex;align-items:center}
.qty.sm{height:48px}.qty.sm button{width:44px}
footer a{min-height:44px;display:flex;align-items:center;padding:0}
.chk{min-height:44px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
.cbx{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer}
.hsw button{width:44px;height:44px;border:0;background:transparent;padding:0;display:grid;place-items:center;box-shadow:none}
.hsw button.on{box-shadow:none}
.hsw button i{display:block;width:32px;height:32px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.hsw button.on i{box-shadow:0 0 0 2px var(--ink)}
.hsw{gap:0}
nav.main{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:none}
.hspace{flex:0 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:767.98px){.hn{display:none}.hspace{flex:1}}
.co>*{min-width:0}
/* --- audit: tooltips for icon buttons (hover + keyboard focus) --- */
[data-tip]::after{content:attr(data-tip);display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:500 12px/1.4 Poppins,system-ui,sans-serif;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;z-index:70}
[data-tip-pos=end]::after{left:auto;right:0;transform:none}
[data-tip-pos=start]::after{left:0;transform:none}
[data-tip-pos=top]::after{top:auto;bottom:calc(100% + 8px);left:auto;right:0;transform:none}
@media (hover:hover){[data-tip]:hover::after{display:block}}
[data-tip]:focus-visible::after{display:block}
/* --- audit: focus rings on fields --- */
label.f input:focus,label.f select:focus,label.f textarea:focus,.coupon input:focus{box-shadow:0 0 0 2px var(--green);border-color:var(--green)}
/* --- audit: L1 frames for lists/tables --- */
.tblwrap{border:1px solid var(--line);border-radius:16px;background:#fff}
.tbl th{background:var(--stage);position:relative}
.tblwrap{position:relative}
.tbl tr:last-child td{border-bottom:0}
.olist{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.olist .ord{border:0;border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.olist .ord:last-child{border-bottom:0}
.olist .empty{margin:0}
.modal .box{border:1px solid var(--line)}
/* --- audit: visible labels on filters --- */
.fl{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;flex:1 1 160px;min-width:0}
.fl .sel{width:100%;flex:none}
.search,.search input{min-width:0}
.pd>*{min-width:0}
.buy .btn{white-space:normal}
b,strong,th{font-weight:600}
nav.main a{min-height:44px;display:inline-flex;align-items:center}
.logo{min-height:44px}
.qty button{width:44px}
.search .sl{font-weight:600;font-size:14px;white-space:nowrap}
.filters{align-items:flex-end}
@media (max-width:767.98px){.filters .fl{flex:1 1 0}.filters .fl .sel{font-size:14px;padding:0 8px;height:44px}}
/* --- audit: plain-text savings (no decorative pill) --- */
.save{background:none;padding:0;color:var(--ok);font-weight:600;border-radius:0}
.desc{max-width:65ch}
.panel p{max-width:70ch}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{background:#8f1d17}
.reqnote{font-size:14px;color:var(--muted);margin:0 0 16px}
/* --- audit: product editor page (Form pattern) --- */
.pe{max-width:640px;margin:0 auto;padding-bottom:96px}
.pe .fg{grid-template-columns:1fr 1fr}
.pe-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:flex-end;gap:8px;margin-top:24px;z-index:5}
.colrow{align-items:flex-end;flex-wrap:wrap}
.fg>*{min-width:0}
.colrow .f input{width:100%;min-width:0}
.pe-bar .btn{flex:1 1 auto}
input[type=file]{max-width:100%;min-width:0}
.colrow .f{flex:1}
.colrow .f.tone{flex:0 0 auto}
@media (max-width:767.98px){.pe .fg{grid-template-columns:1fr}}

/* ================= Tema: tienda de hogar (crema, Poppins, esquinas rectas) ================= */
:root{
  --bg:#F7F1EA; --paper:#FFFFFF; --stage:#EFE6DB; --stage-2:#E6DACB; --ink:#0B0B0B; --text:#555555; --muted:#777068; --line:#D9CFC2;
  --sale:#EA6036; --green:#0B0B0B; --accent:#0B0B0B; --accent-d:#333333; --olive:#0B0B0B; --soft:#EFE6DB; --butter:#EA6036; --r:0px;
}
*,*::before,*::after{border-radius:0!important}
body{background:var(--bg);color:var(--text);font:15px/1.6 Poppins,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Poppins,system-ui,sans-serif;font-weight:500;font-stretch:normal;letter-spacing:0;line-height:1.2;color:var(--ink)}
b,strong,th{color:var(--ink)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--ink)}
.wrap{max-width:1280px;padding:0 40px}
@media (max-width:767.98px){.wrap{padding:0 16px}}

/* topbar + header */
.topbar{background:var(--ink);color:#fff;font-size:13px}
header.site{background:var(--bg);backdrop-filter:none;border-bottom:1px solid var(--ink)}
.hrow{height:80px;gap:24px}
.logo{font-family:Poppins,sans-serif;font-size:30px;font-weight:500;font-stretch:normal;letter-spacing:-.04em;color:var(--ink)}
.logo svg{width:28px;height:28px}
.hsearch{flex:1 1 auto;display:flex;max-width:680px;height:44px;border:1px solid var(--ink);background:transparent;margin:0 auto}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;padding:0 16px;font:15px Poppins,sans-serif;color:var(--ink);outline:0}
.hsearch input::placeholder{color:#8a8178}
.hsearch:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.hsearch button{width:60px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
.hsearch button svg{width:20px;height:20px}
.hlink{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:17px;color:var(--ink);text-decoration:none;white-space:nowrap;position:relative}
.hlink svg{width:22px;height:22px}
.hlink:hover{text-decoration:underline;text-underline-offset:4px}
.hlink .badge{position:static;margin-left:-4px}
.iconbtn:hover{background:transparent;opacity:.7}
.badge{background:var(--sale);color:#fff;border-radius:999px!important}
nav.main{flex:none;margin:0;justify-content:center;gap:32px;padding:0 0 8px;display:flex;overflow-x:auto}
nav.main a{font-size:17px;font-weight:500;color:var(--ink);padding:0;background:none!important}
nav.main a:hover,nav.main a.on{text-decoration:underline;text-underline-offset:6px;color:var(--ink)}
nav.main a.sale{color:var(--sale)}
@media (max-width:767.98px){
  .hrow{height:auto;flex-wrap:wrap;padding:8px 0 12px;gap:8px 12px}
  .hsearch{order:5;flex:1 1 100%;max-width:none;margin:0}
  .hspace{flex:1}
  nav.main{display:none}
  .logo{font-size:26px}
  .hlink.hn{display:none}
  .hsearch{width:100%}
}

/* buttons, chips, inputs */
.btn{font-weight:500;letter-spacing:.02em;padding:12px 24px}
.btn-p,.btn-a{background:var(--ink);color:#fff}
.btn-p:hover,.btn-a:hover{background:#333}
.btn-g{background:transparent;border:1px solid var(--line)}
.btn-g:hover{border-color:var(--ink)}
.btn-o{border-width:1px}
.btn-light{background:#fff;color:var(--ink)}
.chip{border-width:1px}
.chip.on{background:var(--ink);border-color:var(--ink)}
.search{background:transparent;border:1px solid var(--ink);height:44px}
.search:focus-within{box-shadow:none;outline:2px solid var(--ink);outline-offset:2px}
.sel,.minisel{border-width:1px;background:transparent}
label.f input,label.f select,label.f textarea,.coupon input{border-width:1px;background:#fff}
label.f input:focus,label.f select:focus,label.f textarea:focus,.coupon input:focus{box-shadow:0 0 0 1px var(--ink);border-color:var(--ink)}
.link{color:var(--ink)}

/* banner */
.banner{position:relative;height:clamp(240px,31vw,420px);overflow:hidden;border-bottom:1px solid var(--ink)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block}
.slide .sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}
.slide .sa,.slide .sb{position:absolute;top:0;bottom:0;width:50%}
.slide .sa{left:0}.slide .sb{right:0}
.slide .sa svg,.slide .sb svg{position:absolute;inset:8% 4% 0;width:92%;height:92%}
.lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);background:#F7EFE6;border:2px solid #4A3428;border-radius:14px!important;padding:24px 40px;text-align:center;color:#4A3428;width:min(460px,86%)}
.lbl h2{font-size:clamp(20px,2.6vw,34px);font-weight:600;color:#4A3428;letter-spacing:-.01em;line-height:1.1}
.lbl p{margin:4px 0 16px;font-size:clamp(14px,1.6vw,20px);color:#4A3428}
.lbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 32px;background:#A9BCD0;color:#2E3B4A;text-decoration:none;font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:15px;border-radius:6px!important}
.lbtn:hover{background:#97AEC6}
.dots{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex}
.dots button{width:36px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.dots button i{display:block;width:10px;height:10px;border-radius:50%!important;background:#fff;opacity:.6}
.dots button.on i{opacity:1}
@media (max-width:767.98px){.banner{height:300px}.lbl{padding:16px 16px}.slide .sa{display:none}.slide .sb{width:100%}}

/* sections */
.sec{padding:48px 0 8px}
.sec-h{align-items:center;margin-bottom:24px}
.sec-h h2{font-size:24px;font-weight:500}
.sec-h h2.ul{font-size:20px;text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:1px}
.cats{grid-template-columns:repeat(4,1fr);gap:24px}
.cat{background:none;aspect-ratio:auto;position:static;overflow:visible;text-align:center}
.cat:hover{background:none}
.cat .ca{position:relative;inset:auto;aspect-ratio:1;background:var(--stage);overflow:hidden}
.cat b{position:static;display:block;padding-top:12px;font-weight:400;font-size:15px;color:var(--ink)}
@media (max-width:767.98px){.cat{flex:0 0 36%}.cats{gap:12px;margin:0 -16px;padding:0 16px}}
.strip{display:block;background:var(--sale);color:#fff;text-align:center;font-weight:600;font-size:clamp(16px,2.4vw,30px);text-transform:uppercase;letter-spacing:.01em;padding:16px 24px;text-decoration:none;margin:48px 0 0}
.strip:hover{background:#d9532b}
.perks{grid-template-columns:repeat(3,1fr);gap:32px;margin:40px 0 16px}
.perk{flex-direction:column;align-items:center;text-align:center;gap:8px}
.perk svg{color:var(--ink);width:30px;height:30px}
.perk b{display:block;font-weight:300;font-size:clamp(18px,2.2vw,28px);text-transform:uppercase;color:var(--ink);line-height:1.2;margin-bottom:8px}
.perk span{font-size:15px;color:var(--text);font-weight:300}
@media (max-width:767.98px){.perks{grid-template-columns:1fr;gap:24px}}

/* promo tiles */
.tiles{display:grid;gap:8px;margin-top:48px}
.tiles.two{grid-template-columns:1fr 1fr}
.tiles.three{grid-template-columns:repeat(3,1fr);margin-top:8px}
.tile{position:relative;display:block;aspect-ratio:16/11;overflow:hidden;color:#fff;text-decoration:none}
.tiles.three .tile{aspect-ratio:4/3}
.tile .tbg{position:absolute;inset:0}
.tile .tbg svg,.tile .tbg img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.35))}
.tile .tt,.tile .tm{z-index:1}
.cat .ca img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.thumb{flex:none;width:72px;height:72px;border:1px solid var(--line);padding:0;background:var(--stage);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border:2px solid var(--ink)}
.tile .tt{position:absolute;left:0;right:0;top:16%;text-align:center;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(44px,6.4vw,92px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.tiles.three .tile .tt{font-size:clamp(36px,4.6vw,64px);top:auto;bottom:16%}
.tile .tm{position:absolute;left:0;right:0;bottom:12%;text-align:center;text-transform:uppercase;font-size:18px;text-decoration:underline;text-underline-offset:6px}
.tiles.three .tile .tm{display:none}
.tile:hover .tbg{filter:brightness(1.08)}
@media (max-width:767.98px){.tiles.two,.tiles.three{grid-template-columns:1fr}}

/* product cards */
.grid{gap:24px}
.card{border:1px solid var(--line);background:var(--bg)}
.card .cm{position:relative}
.card .media{aspect-ratio:1/1;border-radius:0}
.card .body{padding:12px 12px 16px;gap:4px}
.card .nm{font-weight:400;font-size:15px;color:var(--ink);line-height:1.35}
.card .nm:hover{text-decoration:underline}
.price{gap:8px;align-items:center;margin:0}
.price s{color:#777;font-size:14px}
.price b{font-weight:600;font-size:15px}
.off{display:inline-block;background:var(--sale);color:#fff;font-size:13px;font-weight:500;padding:0 6px;line-height:24px;text-transform:uppercase}
.from{font-size:13px;color:var(--muted);margin-right:-4px}
.promo{color:var(--sale);font-weight:500;font-size:14px;line-height:1.35}
.fav{top:4px;left:4px;right:auto;background:transparent}
.fav svg{width:18px;height:18px}
.fav.on svg{fill:var(--sale);stroke:var(--sale)}
.tag{top:12px;right:12px;left:auto;background:var(--sale);color:#fff;font-size:12px;font-weight:500;letter-spacing:.04em;padding:2px 8px;text-transform:uppercase}
.tag.out{background:var(--ink)}
.btn-add{margin-top:12px;width:100%;background:transparent;border:1px solid var(--ink);color:var(--ink);font-size:14px;padding:8px 12px}
.btn-add:hover{background:var(--ink);color:#fff}
.btn-add[disabled]{border-color:var(--line);color:var(--muted)}
.sw{border-radius:50%!important}

/* shop with sidebar */
.shop-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:32px 0 24px}
.shop-top .crumbs{padding:0;font-size:15px;color:var(--ink)}
.shop-meta{display:flex;align-items:center;gap:16px}
.shop-meta #rcount{padding-right:16px;border-right:1px solid var(--ink);font-size:15px}
.sortl{display:flex;align-items:center;gap:4px;font-weight:500;color:var(--ink);font-size:16px}
.sortl select{border:0;background:transparent;font:500 16px Poppins,sans-serif;color:var(--ink);min-height:44px;cursor:pointer}
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start;padding-bottom:24px}
.side h1{font-size:24px;font-weight:500;text-transform:uppercase;margin:0 0 24px}
.side .search{margin-bottom:8px}
.fgrp{border-bottom:1px solid var(--ink);padding:8px 0}
.fgrp summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:18px;font-weight:500;color:var(--ink)}
.fgrp summary::-webkit-details-marker{display:none}
.fgrp summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-135deg);margin-right:4px}
.fgrp:not([open]) summary::after{transform:rotate(45deg)}
.fopts{display:flex;flex-direction:column;padding:4px 0 12px}
.fopt{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px;color:var(--text);text-decoration:none;cursor:pointer}
.fopt small{font-size:12px;color:var(--muted)}
.fopt:hover,.fopt.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.fopt.sale{color:var(--sale)}
.fopt input{accent-color:var(--ink);width:16px;height:16px}
.shop .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media (max-width:767.98px){
  .shop{grid-template-columns:1fr;gap:16px}
  .shop .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .fopt{min-height:44px}
  .shop-top{padding:16px 0}
}

/* product page */
.pd-media{border-radius:0;background:var(--stage)}
.pd h1{font-family:Poppins,sans-serif;font-weight:500;font-stretch:normal;font-size:clamp(26px,3vw,36px);line-height:1.2;letter-spacing:-.01em}
.pd .price b{font-size:26px;font-weight:600}
.eyebrow{color:var(--text)}
.cbtn{border-width:1px}
.qty{border-width:1px;background:transparent}
.assure div{background:var(--stage)}

/* panels, misc */
.panel{background:#fff;border-width:1px}
aside .panel{background:var(--stage);border-color:var(--line)}
.radio{border-width:1px}
.radio.on{border-color:var(--ink);background:#fff}
.radio input{accent-color:var(--ink)}
.kpi{background:#fff;border:1px solid var(--line)}
.kpi:first-child{background:var(--ink)}
.tabs{background:transparent;border-bottom:1px solid var(--line);padding:0;width:auto}
.tabs button{border-bottom:2px solid transparent}
.tabs button.on{background:transparent;border-bottom-color:var(--ink)}
.empty h3{font-weight:500}
.shop-head h1,.adm-h h1,.ok-hero h1{font-family:Poppins,sans-serif;font-weight:500;font-stretch:normal;letter-spacing:-.01em}
.ok-hero .ic{background:var(--ink);color:#fff;border-radius:50%!important}
.st-nuevo{background:#FBE3D9;color:#A8401F}
.save{color:var(--sale)}
.note{background:#F3E4D3}
.sysnote{background:#F3E4D3}
.wafab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%!important;background:#25D366;color:#fff;display:grid;place-items:center;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.wafab svg{width:28px;height:28px}
body.has-sticky .wafab{bottom:88px}

/* footer */
footer.site{background:var(--bg);color:var(--text);border-top:1px solid var(--ink);margin-top:64px}
footer .fbrand{display:none}
footer h4{color:var(--ink);font-family:Poppins,sans-serif;font-weight:500;font-size:17px}
footer a{color:var(--text)}
footer a:hover{color:var(--ink);text-decoration:underline}
footer .bottom{border-top:1px solid var(--line);color:var(--muted)}
.toast{background:var(--ink)}
[data-tip]::after{font-family:Poppins,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Fotos de producto completas, sin recorte */
.card .media img,.pd-media img,.ci .th img,.sumi .th img,.tbl .th img,.cat .ca img,.thumb img{object-fit:contain;background:#fff}
.card .media img{padding:8px;box-sizing:border-box}
.pd-media img{padding:16px;box-sizing:border-box}
.cat .ca img{padding:10px;box-sizing:border-box}
</style>

const fmt = n => ((typeof S!=='undefined' && S.config && S.config.currency==='UYU') ? '$ ' : 'US$ ') + (v=>v.toLocaleString('es-UY',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2}))(Math.round((Number(n)||0)*100)/100);
const vprice = (p, ci) => { const c=(p.colors||[])[ci||0]; return c && Number(c.price)>0 ? Number(c.price) : Number(p.price)||0; };
const multiPrice = p => new Set((p.colors||[]).map(c=>Number(c.price)||0).filter(Boolean)).size > 1;
const num = v => { const n = Number(String(v).replace(/[^\d.-]/g,'')); return isFinite(n) ? n : 0; };
const LS = {
  get(k,d){ try{ const v = localStorage.getItem('nogal_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('nogal_'+k, JSON.stringify(v)); }catch(e){} }
};
function shade(hex, p){
  let h = String(hex||'#999').replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join('');
  const n = parseInt(h,16); if(isNaN(n)) return hex;
  let r=n>>16, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(p<0 ? v*(1+p/100) : v+(255-v)*(p/100))));
  return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(String(c)) ? c : '#B9A88F'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }
function waDigits(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d='598'+d.slice(1); else if(d.length===8 && d.startsWith('9')) d='598'+d; return d; }

const okImg = u => typeof u==='string' && /^(data:image\/|img\/|\.\/img\/|https:\/\/)/.test(u);
function mediaSrc(p, ci){
  const v = (p.colors||[])[ci||0];
  if(p.imgOverride && okImg(p.image)) return p.image;
  if(v && okImg(v.img)) return v.img;
  if(okImg(p.image)) return p.image;
  return '';
}
function cardSrc(p){
  if(p.imgOverride && okImg(p.image)) return p.image;
  const cut = (p.colors||[]).map(c=>c.img).find(u=>okImg(u) && !/-amb\.jpg$/.test(u)) || (p.gallery||[]).find(u=>okImg(u) && !/-amb\.jpg$/.test(u));
  return cut || mediaSrc(p,0);
}
function media(p, ci, src){
  const u = src || mediaSrc(p, ci);
  if(u) return `<img src="${esc(u)}" alt="${esc(p.name)}${(p.colors||[])[ci||0]?' en '+esc(p.colors[ci||0].n.toLowerCase()):''}" loading="lazy">`;
  const col = (p.colors && p.colors[ci||0]) ? p.colors[ci||0].h : '#C9B79C';
  return art(p.type, col);
}

const products = () => (S.dbProducts && S.dbProducts.length ? S.dbProducts : BASE_PRODUCTS).slice().sort((a,b)=>(a.order||0)-(b.order||0));
const visible = () => products().filter(p => p.active !== false);
const byId = id => products().find(p => p.id === id);
const catName = id => (CATS.find(c=>c.id===id)||{n:id}).n;
const cfg = () => S.config;

/* ================= Carrito ================= */
function saveCart(){ LS.set('cart', S.cart); updateBadges(); }
function addToCart(id, ci, qty){
  const p = byId(id); if(!p) return;
  const key = id+'|'+(ci||0);
  const line = S.cart.find(l=>l.key===key);
  const inCart = S.cart.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0);
  const stock = Number(p.stock)||0;
  if(inCart + qty > stock){ toast(stock ? `Quedan ${stock} unidades: ya tenés el máximo en el carrito.` : 'Este mueble no tiene stock. Consultanos por WhatsApp.'); return; }
  if(line) line.qty += qty; else S.cart.push({key, id, ci:ci||0, qty});
  saveCart(); renderCart(); openDrawer('cart');
}
function cartLines(){
  return S.cart.map(l => { const p = byId(l.id); if(!p || p.active===false) return null;
    const col = (p.colors||[])[l.ci] || {n:'', h:'#ccc'};
    return {...l, p, col, unit:vprice(p,l.ci), total:vprice(p,l.ci)*l.qty}; }).filter(Boolean);
}
function findCoupon(code){
  code = String(code||'').trim().toUpperCase(); if(!code) return null;
  return (cfg().coupons||[]).find(c => c.active !== false && String(c.code).toUpperCase() === code) || null;
}
function totals(form){
  const lines = cartLines();
  const sub = lines.reduce((a,l)=>a+l.total,0);
  const cp = findCoupon(S.coupon);
  let disc = 0;
  if(cp) disc = cp.type==='pct' ? Math.round(sub * Math.min(100,Number(cp.value)||0))/100 : Math.min(sub, Number(cp.value)||0);
  const after = sub - disc;
  const f = form || S.form; const c = cfg();
  let ship = 0, shipLabel = 'Retiro en showroom';
  if(f.delivery !== 'retiro'){
    if(after >= (Number(c.freeFrom)||Infinity) && Number(c.freeFrom)>0){ ship = 0; shipLabel = 'Envío gratis'; }
    else { ship = f.dept==='Montevideo' ? Number(c.shipMvd)||0 : Number(c.shipInt)||0; shipLabel = 'Envío a '+(f.dept||'domicilio'); }
  }
  const base = after + ship; let adj = 0, adjLabel = '';
  if(f.pay==='tarjeta' && Number(c.cardFee)>0){ adj = Math.round(base*Number(c.cardFee))/100; adjLabel = `Recargo tarjeta (${Number(c.cardFee)}%)`; }
  else if((f.pay==='transferencia'||f.pay==='efectivo') && Number(c.cashDisc)>0){ adj = -Math.round(base*Number(c.cashDisc))/100; adjLabel = `Descuento ${f.pay==='transferencia'?'transferencia':'efectivo'} (${Number(c.cashDisc)}%)`; }
  return {lines, sub, cp, disc, ship, shipLabel, adj, adjLabel, total: base + adj, count: lines.reduce((a,l)=>a+l.qty,0)};
}

  const ct = [];
  if(c.whatsapp) ct.push(`<a href="https://wa.me/${waDigits(c.whatsapp)}" target="_blank" rel="noopener">WhatsApp ${esc(c.whatsapp)}</a>`);

function filtered(){
  const f = S.f; const q = f.q.trim().toLowerCase();
  let list = visible().filter(p =>
    (f.cat==='todas' || p.cat===f.cat) &&
    (!q || [p.name,p.material,catName(p.cat),p.desc].join(' ').toLowerCase().includes(q)) &&
    (!f.max || p.price <= f.max) &&
    (!f.sale || p.compare > p.price) &&
    (!f.mat || (p.colors||[]).some(c=>c.n.toLowerCase().includes(f.mat)) || String(p.material||'').toLowerCase().includes(f.mat)) &&
    (!f.sub || p.sub===f.sub));
  const s = f.sort;
  if(s==='precio-asc') list.sort((a,b)=>a.price-b.price);
  else if(s==='precio-desc') list.sort((a,b)=>b.price-a.price);
  else if(s==='nombre') list.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  else if(s==='ofertas') list.sort((a,b)=>((b.compare>b.price)-(a.compare>a.price)));
  else list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || (a.order||0)-(b.order||0));
  return list;
}

function fieldError(k){
  const f = S.form; const v = String(f[k]||'').trim();
  if(k==='name' && v.length < 3) return 'Escribí tu nombre y apellido para saber a quién entregar.';
  if(k==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Escribí un email como nombre@correo.com para mandarte la confirmación.';
  if(k==='phone' && v.replace(/\D/g,'').length < 8) return 'Escribí un celular de 9 dígitos, como 099 123 456, para coordinar la entrega.';
  if(f.delivery !== 'retiro'){
    if(k==='city' && !v) return 'Escribí la ciudad o el barrio de entrega.';
    if(k==='addr' && v.length < 5) return 'Escribí calle y número para llevarte el pedido.';
  }
  return '';
}
function showFieldError(k, msg){
  const inp = document.querySelector(`#coform [name="${k}"]`); if(!inp) return;
  const lab = inp.closest('.f'); if(!lab) return;
  let er = lab.querySelector('.er');
  if(msg){ S.errors[k]=msg; lab.classList.add('bad'); inp.setAttribute('aria-invalid','true'); if(!er){ er=document.createElement('span'); er.className='er'; er.id='er-'+k; lab.appendChild(er); inp.setAttribute('aria-describedby','er-'+k); } er.textContent = msg; }
  else { delete S.errors[k]; lab.classList.remove('bad'); inp.removeAttribute('aria-invalid'); if(er) er.remove(); }
}
function validate(){
  const f = S.form, e = {};
  ['name','email','phone','city','addr'].forEach(k=>{ const m = fieldError(k); if(m) e[k] = m; });
  S.errors = e; return !Object.keys(e).length;
}
function orderText(o){
  const L = [];
  L.push(`Hola! Quiero confirmar mi pedido *${o.id}*`, '');
  o.items.forEach(i => L.push(`• ${i.qty} × ${i.name} (${i.color}) — ${fmt(i.price*i.qty)}`));
  L.push('', `Subtotal: ${fmt(o.sub)}`);
  if(o.disc) L.push(`Descuento ${o.coupon}: −${fmt(o.disc)}`);
  L.push(`${o.shipLabel}: ${o.ship?fmt(o.ship):'Gratis'}`);
  if(o.adj) L.push(`${o.adjLabel}: ${o.adj<0?'−':'+'}${fmt(Math.abs(o.adj))}`);
  L.push(`*Total: ${fmt(o.total)}*`, '');
  L.push(`Nombre: ${o.customer.name}`, `Celular: ${o.customer.phone}`, `Email: ${o.customer.email}`);
  if(o.customer.doc) L.push(`CI: ${o.customer.doc}`);
  L.push(o.delivery==='retiro' ? 'Entrega: Retiro en showroom' : `Entrega: ${o.customer.addr}, ${o.customer.city}, ${o.customer.dept}`);
  if(o.customer.notes) L.push(`Notas: ${o.customer.notes}`);
  L.push(`Pago: ${PAYS[o.pay]}`);
  return L.join('\n');
}
async function placeOrder(){
  if(S.placing) return;
  if(!validate()){ render(); const el = document.querySelector('.bad'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const t = totals();
  // control de stock
  for(const l of t.lines){ const tot = t.lines.filter(x=>x.id===l.id).reduce((a,x)=>a+x.qty,0); if(tot > (Number(l.p.stock)||0)){ toast(`Quedan ${Number(l.p.stock)||0} de ${l.p.name}. Bajá la cantidad en el carrito para seguir.`); return; } }
  S.placing = true; { const b=document.querySelector('#coform button[type=submit]'); if(b){ b.textContent='Enviando pedido…'; b.setAttribute('aria-busy','true'); } }
  const f = S.form;
  const o = {
    id: 'NG-' + Date.now().toString(36).toUpperCase().slice(-6),
    createdAt: Date.now(), status:'nuevo', paid:false, stockApplied:false,
    items: t.lines.map(l=>({id:l.id, name:l.p.name, color:l.col.n, colorHex:l.col.h, type:l.p.type, qty:l.qty, price:l.unit})),
    sub:t.sub, disc:t.disc, adj:t.adj||0, adjLabel:t.adjLabel||'', coupon: t.cp ? t.cp.code : '', ship:t.ship, shipLabel:t.shipLabel, total:t.total,
    delivery: f.delivery==='retiro' ? 'retiro' : 'envio', pay:f.pay,
    customer:{name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), doc:(f.doc||'').trim(),
      dept: f.delivery==='retiro'?'':f.dept, city: f.delivery==='retiro'?'':(f.city||'').trim(), addr: f.delivery==='retiro'?'':(f.addr||'').trim(), notes:(f.notes||'').trim()},
    history:[{s:'nuevo', t:Date.now()}]
  };
  let saved = false;
  if(S.db && S.uid){
    try{
      const ref = S.db.doc('orders/'+S.uid);
      const snap = await ref.get();
      const cur = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {orders:[]};
      cur.orders = (cur.orders||[]).concat([o]); cur.updatedAt = Date.now();
      await ref.set(cur); saved = true;
    }catch(err){ console.warn('No se pudo guardar el pedido', err); }
  }
  if(!saved && S.dbState==='static'){
    try{
      const hp = (document.querySelector('#coform [name=website]')||{}).value || '';
      const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 15000);
      const r = await fetch('api/pedido', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...o, website: hp}), signal: ctl.signal});
      clearTimeout(tm);
      const res = r.ok ? await r.json() : null;
      if(res && res.ok){ saved = true; o.notified = true; }
    }catch(err){ console.warn('No se pudo enviar el pedido', err); }
  }
  o.saved = saved;
  S.localOrders = [o, ...S.localOrders.filter(x=>x.id!==o.id)].slice(0,30); LS.set('orders', S.localOrders);
  LS.set('customer', {...S.form, notes:''});
  S.lastOrder = o; LS.set('lastOrder', o);
  S.cart = []; saveCart(); S.coupon=''; LS.set('coupon','');
  S.placing = false; S.errors = {};
  go('pedido-confirmado');
}

function syncEditingFromForm(){
  const fm = $('#pform'); if(!fm) return;
  const fd = new FormData(fm); const p = S.editing;
  ['name','cat','type','dims','material','desc'].forEach(k=>p[k]=String(fd.get(k)||''));
  p.price = num(fd.get('price')); p.compare = num(fd.get('compare')); p.stock = Math.max(0, Math.round(num(fd.get('stock'))));
  p.featured = !!fd.get('featured'); p.active = !!fd.get('active');
  p.colors = (p.colors||[]).map((c,i)=>{ const o={ n: (fm.querySelector(`[data-cn="${i}"]`)||{}).value || c.n, h: (fm.querySelector(`[data-ci="${i}"]`)||{}).value || c.h };
    const cc=num((fm.querySelector(`[data-cc="${i}"]`)||{}).value||''), cp=num((fm.querySelector(`[data-cp="${i}"]`)||{}).value||'');
    if(cc>0) o.cost=cc; if(cp>0) o.price=cp; return o; });
  const vp = p.colors.map(c=>Number(c.price)||0).filter(Boolean); if(vp.length) p.price = Math.min(...vp);
}
async function saveProduct(){
  clearTimeout(window._pd);
  syncEditingFromForm();
  const p = S.editing;
  if(!p.name.trim()){ toast('Escribí el nombre del producto para guardarlo.'); return; }
  if(!(p.price>0)){ toast('Escribí un precio mayor a 0 para guardarlo.'); return; }
  if(!p.colors.length) p.colors = [{n:'Único', h:'#C9B79C'}];
  if(!p.id){ p.id = 'p' + Date.now().toString(36); p.order = Math.max(0,...products().map(x=>x.order||0)) + 1; }
  if(!(await ensureDbCatalog())) return;
  try{ await S.db.doc('products/'+p.id).set(p); try{ localStorage.removeItem('nogal_'+draftKey()); }catch(e){} S.editing=null; S.editingId=null; toast('Producto guardado'); S.adminTab='productos'; go('admin'); }
  catch(e){ toast(e && e.code==='quota_exceeded' ? 'La base de datos está llena. Borrá productos que ya no uses y probá de nuevo.' : 'No se guardaron los cambios. Revisá la conexión y probá de nuevo.'); }
}
async function ensureDbCatalog(){
  if(!S.db){ toast('No hay conexión con la base de datos. Recargá la página y probá de nuevo.'); return false; }
  if(S.dbProducts && S.dbProducts.length) return true;
  return await seedCatalog(true);
}
async function seedCatalog(silent){
  if(!S.db){ toast('No hay conexión con la base de datos. Recargá la página y probá de nuevo.'); return false; }
  try{ for(const p of BASE_PRODUCTS){ await S.db.doc('products/'+p.id).set(p); } if(!silent) toast('Catálogo guardado'); return true; }
  catch(e){ toast('No se cargó el catálogo. Revisá la conexión y probá de nuevo.'); return false; }
}
async function saveConfig(next){
  if(!S.db){ toast('No hay conexión con la base de datos. Recargá la página y probá de nuevo.'); return false; }
  try{ await S.db.doc('config/store').set(next); S.config = {...DEFAULT_CONFIG, ...next}; renderChrome(); return true; }
  catch(e){ toast('No se guardaron los cambios. Revisá la conexión y probá de nuevo.'); return false; }
}
const writeQ = {};
function queued(key, fn){ writeQ[key] = (writeQ[key]||Promise.resolve()).then(fn, fn); return writeQ[key]; }
async function adjustStock(id, delta){
  const p = byId(id); if(!p || !S.db) return;
  const ref = S.db.doc('products/'+id);
  const snap = await ref.get(); const cur = snap.exists ? Number(snap.data().stock)||0 : Number(p.stock)||0;
  if(snap.exists) await ref.update({stock: Math.max(0, cur + delta)});
}
async function updateOrder(docId, orderId, mut){
  return queued('o:'+docId, async ()=>{
    const ref = S.db.doc('orders/'+docId);
    const snap = await ref.get(); if(!snap.exists) return;
    const data = JSON.parse(JSON.stringify(snap.data()));
    const o = (data.orders||[]).find(x=>x.id===orderId); if(!o) return;
    await mut(o); data.updatedAt = Date.now();
    await ref.set(data);
  });
}
async function setStatus(docId, orderId, status){
  if(!(await ensureDbCatalog())) return;
  try{
    await updateOrder(docId, orderId, async o => {
      o.status = status; o.history = (o.history||[]).concat([{s:status,t:Date.now()}]);
      if(!o.stockApplied && ['confirmado','enviado','entregado'].includes(status)){ for(const i of o.items) await queued('p:'+i.id, ()=>adjustStock(i.id, -i.qty)); o.stockApplied = true; }
      if(o.stockApplied && status==='cancelado'){ for(const i of o.items) await queued('p:'+i.id, ()=>adjustStock(i.id, i.qty)); o.stockApplied = false; }
    });
    toast('Pedido actualizado');
  }catch(e){ toast('No se actualizó el pedido. Revisá la conexión y probá de nuevo.'); }
}

function trapFocus(e){
  if(e.key!=='Tab') return;
  const box = $('#modal .box') || document.querySelector('.drawer.on'); if(!box) return;
  const f = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

  if(h==='inicio') html = viewHome();
  else if(h==='tienda'||h==='ofertas'||h.startsWith('cat-')){
    const nc = h.startsWith('cat-') ? h.slice(4) : 'todas', ns = h==='ofertas';
    if(nc!==S.f.cat || ns!==S.f.sale){ S.f.sub=''; S.f.mat=''; S.f.max=0; }
    S.f.cat = nc; S.f.sale = ns; html = viewShop(); }
  else if(h.startsWith('p-')) html = viewProduct(h.slice(2));
  else if(h==='favoritos') html = viewFavs();
  else if(h==='checkout') html = viewCheckout();
  else if(h==='pedido-confirmado') html = viewSuccess();
  else if(h==='mis-pedidos') html = viewMyOrders();
  else if(h==='envios') html = viewShipping();
  else if(h==='admin') html = viewAdmin();
  else if(h.startsWith('admin-producto')){
    const id = h.startsWith('admin-producto-') ? h.slice(15) : '';
    if($('#pform') && S.editing) syncEditingFromForm();

}

          try{ await queued('p:'+p.id, ()=>S.db.doc('products/'+p.id).update({colors:nc, price:isFinite(np)?np:p.price})); n++; }catch(err){}

        toast(`Precios recalculados en ${n} productos`);
      }); break; }

      saveCart(); renderCart(); if(currentHash()==='checkout') render(); break; }

function resizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const max = 900; let w = img.width, h = img.height; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img,0,0,w,h);
        let q = .82, url = cv.toDataURL('image/jpeg', q); while(url.length > 190000 && q > .35){ q -= .1; url = cv.toDataURL('image/jpeg', q); }
        res(url); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ================= Versión publicada fuera de Claude: lee data/tienda.json ================= */
async function loadStatic(){
  try{
    const r = await fetch('data/tienda.json', {cache:'no-cache'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(Array.isArray(d.products) && d.products.length) S.dbProducts = d.products.map(p => ({...p, price:Number(p.price)||0, compare:Number(p.compare)||0, stock:Number(p.stock)||0, colors:Array.isArray(p.colors)?p.colors:[]}));
    if(d.config) S.config = {...DEFAULT_CONFIG, ...d.config};
    S.dbState = 'static';
  }catch(e){ S.dbState = 'offline'; }
  render();
}

/* ================= Conexión con la base de datos ================= */
async function connect(){
  if(!window.claude || typeof window.claude.use !== 'function'){ await loadStatic(); return; }
  const slow = setTimeout(()=>{ if(S.dbState==='connecting'){ S.dbState='slow'; renderChrome(); } }, 10000);
  let db=null, user=null;
  try{ [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
  S.db = db; S.user = user;
  if(user){
    try{ S.isAdmin = !!(await Promise.resolve(user.canEdit())); }catch(e){}
    try{ S.uid = await Promise.resolve(user.id()); }catch(e){}
  }
  if(!db){ clearTimeout(slow); S.dbState='offline'; render(); return; }
  const markLive = () => { if(S.dbState!=='live'){ S.dbState='live'; clearTimeout(slow); } };
  db.collection('products').onSnapshot(snap => {
    S.dbProducts = snap.docs.map(d => ({...d.data(), id:d.id}))
      .map(p => ({...p, price:Number(p.price)||0, compare:Number(p.compare)||0, stock:Number(p.stock)||0, colors:Array.isArray(p.colors)?p.colors:[]}));
    if(!snap.metadata.fromCache) markLive();
    softRender();
  }, err => { clearTimeout(slow); S.dbState = S.dbProducts ? 'live' : 'offline'; softRender(); });
  db.doc('config/store').onSnapshot(snap => {
    if(snap.exists) S.config = {...DEFAULT_CONFIG, ...snap.data()};
    softRender();
  }, ()=>{});
  if(S.uid){
    db.doc('orders/'+S.uid).onSnapshot(snap => {
      S.myOrders = snap.exists ? (snap.data().orders||[]) : [];
      softRender();
    }, ()=>{});
  }
  if(S.isAdmin){
    db.collection('orders').onSnapshot(snap => {
      const all = [];
      snap.docs.forEach(d => (d.data().orders||[]).forEach(o => all.push({doc:d.id, o})));
      all.sort((a,b)=>b.o.createdAt-a.o.createdAt);
      S.allOrders = all; softRender();
    }, ()=>{});
  }
  render();
}

lastRoute = currentHash();
