<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nogal — Muebles de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --stage:#E7EAE3; --stage-2:#DDE1D8; --ink:#1A1A1A; --muted:#626963; --line:#DCE0D9;
  --green:#1E3A2F; --green-2:#2A4A3C; --butter:#F0CF5C;
  --accent:#1E3A2F; --accent-d:#13271F; --olive:#1E3A2F; --soft:#E7EAE3;
  --ok:#2F7A4A; --warn:#9A630F; --err:#B3261E; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-stretch:80%;letter-spacing:-.025em;line-height:1;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.hidden{display:none!important}
.price,.tot,.kpi b,.qty span{font-variant-numeric:tabular-nums}

/* header */
.topbar{background:var(--green);color:#E4EAE5;font-size:13px;text-align:center;padding:8px 12px}
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;height:64px}
.logo{font-size:26px;font-weight:800;font-stretch:75%;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
nav.main{display:flex;gap:2px;margin-left:22px}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:999px;font-size:15px;color:var(--muted)}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);background:var(--stage)}
.hspace{flex:1}
.iconbtn{position:relative;width:42px;height:42px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--stage)}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--butter);color:var(--ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.menu-btn{display:none}
@media (max-width:900px){nav.main{display:none}.menu-btn{display:grid}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-p,.btn-a{background:var(--green);color:#fff}
.btn-p:hover,.btn-a:hover{background:var(--accent-d)}
.btn-o{background:transparent;border-color:var(--ink)}
.btn-o:hover{background:var(--ink);color:#fff}
.btn-g{background:#fff;border-color:var(--line)}
.btn-g:hover{border-color:var(--ink)}
.btn-wa{background:#1F8F4E;color:#fff}
.btn-wa:hover{background:#17773f}
.btn-light{background:#fff;color:var(--green)}
.btn-light:hover{background:var(--butter)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:15px}
.link:hover{color:var(--ink)}

/* hero */
.hero{margin-top:20px;background:var(--green);color:#fff;border-radius:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);overflow:hidden;position:relative}
.hero-copy{padding:56px 48px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.hero h1{font-size:clamp(48px,7.6vw,108px);font-weight:800;font-stretch:75%;line-height:.9;letter-spacing:-.035em;max-width:9ch}
.hero p{font-size:18px;color:#C9D6CE;max-width:36ch;margin:0 0 22px}
.hero-stage{position:relative;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 28px 24px;gap:20px}
#herostage{flex:1;position:relative;min-height:240px}
#herostage svg,#herostage img{position:absolute;inset:0;width:100%;height:100%}
.hero-pick{position:relative;background:#fff;color:var(--ink);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-pick .nm{flex:1;min-width:140px}
.hero-pick .nm b{display:block;font-size:16px}
.hero-pick .nm span{font-size:14px;color:var(--muted)}
.hsw{display:flex;gap:8px}
.hsw button{width:30px;height:30px;border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.hsw button.on{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:820px){.hero{grid-template-columns:1fr;border-radius:24px}.hero-copy{padding:32px 22px 0;gap:18px;justify-content:flex-start}.hero-stage{min-height:0;padding:12px 12px 12px}#herostage{min-height:190px}}

.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:36px 0 8px}
.perk{display:flex;gap:12px;align-items:flex-start}
.perk svg{flex:none;width:24px;height:24px;color:var(--green)}
.perk b{display:block;font-weight:600;font-size:15px}
.perk span{font-size:14px;color:var(--muted)}
@media (max-width:900px){.perks{grid-template-columns:1fr 1fr;gap:18px}}

.sec{padding:44px 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec-h h2{font-size:clamp(30px,4.4vw,48px)}

.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{background:var(--stage);border-radius:24px;text-decoration:none;overflow:hidden;position:relative;aspect-ratio:3/3.6;display:block}
.cat .ca{position:absolute;inset:0}
.cat .ca svg{width:100%;height:100%}
.cat b{position:absolute;left:14px;bottom:12px;font-weight:600;font-size:16px}
.cat:hover{background:var(--stage-2)}
@media (max-width:900px){.cats{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}.cats::-webkit-scrollbar{display:none}.cat{flex:0 0 42%}}

/* grid & product cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}}
.grid>*{min-width:0}
.card{display:flex;flex-direction:column;position:relative;min-width:0}
.card .media{aspect-ratio:1/1;background:var(--stage);display:block;position:relative;border-radius:var(--r);overflow:hidden}
.card .media svg,.card .media img{width:100%;height:100%;object-fit:cover}
@media (hover:hover){.card:hover .media{background:var(--stage-2)}}
.card .body{padding:12px 2px 0;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:600;text-decoration:none;line-height:1.25;font-size:16px}
.card .mt{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.price b{font-weight:700;font-size:16px}
.price s{color:var(--muted);font-size:14px}
.plus{position:absolute;right:10px;bottom:10px;z-index:2;width:42px;height:42px;border-radius:999px;border:0;background:var(--green);color:#fff;display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.plus:hover{background:var(--accent-d)}
.plus[disabled]{display:none}
.tag{position:absolute;top:10px;left:10px;background:var(--butter);color:var(--ink);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;z-index:2}
.tag.out{background:var(--ink);color:#fff}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center}
.fav svg{width:19px;height:19px}
.fav.on svg{fill:var(--green);stroke:var(--green)}
.swatches{display:flex;gap:5px;margin-top:6px}
.sw{width:14px;height:14px;border-radius:999px;border:1px solid rgba(0,0,0,.12);display:inline-block}

/* shop */
.shop-head{padding:30px 0 8px}
.shop-head h1{font-size:clamp(40px,6vw,72px);font-weight:800;font-stretch:75%}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 18px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--stage);border-radius:999px;padding:0 16px;height:46px}
.search input{border:0;background:transparent;outline:0;flex:1;height:100%}
.search:focus-within{box-shadow:0 0 0 2px var(--green)}
.search svg{width:18px;height:18px;color:var(--muted)}
.sel{height:46px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px}
@media (max-width:700px){.filters .search{flex-basis:100%}.filters .sel{flex:1 1 0;min-width:0;font-size:14px;padding:0 8px;height:42px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:30px;margin-bottom:8px}

/* product page */
.crumbs{font-size:14px;color:var(--muted);padding:20px 0 4px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.pd{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;padding:12px 0 30px;align-items:start}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:22px}}
.pd-media{background:var(--stage);border-radius:28px;overflow:hidden;aspect-ratio:1/1;position:relative}
@media (min-width:861px){.pd-media{position:sticky;top:84px}}
.pd-media svg,.pd-media img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(36px,4.6vw,60px);font-weight:800;font-stretch:75%;line-height:.95;margin:8px 0 14px}
.pd .price b{font-size:28px}
.pd .price s{font-size:17px}
.eyebrow{font-size:15px;color:var(--muted)}
.save{background:var(--butter);color:var(--ink);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.stock{font-size:14.5px;display:flex;align-items:center;gap:8px;margin:12px 0 20px}
.dot{width:8px;height:8px;border-radius:9px;background:var(--ok)}
.dot.low{background:var(--warn)}.dot.out{background:var(--err)}
.opt-l{font-size:14.5px;font-weight:600;margin:18px 0 10px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px 5px 5px;font-size:14.5px}
.cbtn .sw{width:24px;height:24px}
.cbtn.on{border-color:var(--ink)}
.buy{display:flex;gap:10px;margin:24px 0 10px}
.buy .btn{flex:1;padding:14px 22px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:#fff;height:50px}
.qty button{width:42px;height:100%;border:0;background:transparent;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.qty.sm{height:36px}.qty.sm button{width:32px;font-size:16px}
.specs{margin-top:24px;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs span{color:var(--muted)}
.specs b{font-weight:500;text-align:right}
.desc{color:#3d423e;margin-top:20px;white-space:pre-line;max-width:60ch}
.assure{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.assure div{background:var(--stage);border-radius:16px;padding:12px 14px;font-size:14px}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(20,30,25,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:61;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.left{left:0;right:auto;transform:translateX(-100%)}
.drawer.left.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-size:28px}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{border-top:1px solid var(--line);padding:16px 20px}
.ci{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci .th{width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--stage)}
.ci .th svg,.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .r1{display:flex;justify-content:space-between;gap:8px}
.ci .r2{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tot{display:flex;justify-content:space-between;font-size:15px;margin:5px 0}
.tot.big{font-size:20px;font-weight:700;margin-top:12px}
.tot.disc{color:var(--ok)}
.progress{height:6px;background:var(--stage);border-radius:9px;overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:var(--green)}
.mnav a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:22px;font-weight:600;font-stretch:85%}

/* checkout */
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;padding:20px 0 40px;align-items:start}
@media (max-width:880px){.co{grid-template-columns:1fr}}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px}
.panel h3{font-size:24px;margin-bottom:14px}
.panel+.panel{margin-top:16px}
aside .panel{background:var(--stage);border-color:var(--stage)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}
@media (max-width:520px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;font-size:16px;font-weight:400;outline:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--green)}
label.f.bad input,label.f.bad select{border-color:var(--err)}
label.f .er{color:var(--err);font-size:13px;font-weight:500}
.radios{display:grid;gap:10px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--green)}
.radio.on{border-color:var(--green);background:#F4F6F2}
.radio b{display:block;font-weight:600;font-size:15px}
.radio span{font-size:14px;color:var(--muted)}
.radio em{margin-left:auto;font-style:normal;font-weight:700;font-size:14.5px}
.sumi{display:flex;gap:12px;align-items:center;padding:8px 0}
.sumi .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:#fff;flex:none}
.sumi .th svg,.sumi .th img{width:100%;height:100%;object-fit:cover}
.sumi .n{flex:1;font-size:14.5px;line-height:1.3}
.coupon{display:flex;gap:8px;margin:14px 0}
.coupon input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;background:#fff;text-transform:uppercase}

/* success */
.ok-hero{text-align:center;padding:44px 0 12px}
.ok-hero .ic{width:68px;height:68px;border-radius:99px;background:var(--butter);color:var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.ok-hero h1{font-size:clamp(40px,6vw,64px);font-weight:800;font-stretch:75%}
.ok-hero p{font-size:17px}
.note{background:#FBF2CF;border-radius:16px;padding:14px 16px;font-size:15px}
.note.info{background:var(--stage)}
pre.bank{white-space:pre-wrap;font:inherit;margin:6px 0 0}

/* orders */
.ord{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.ord-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.st,.paid,.unpaid{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--stage)}
.st-nuevo{background:var(--butter);color:var(--ink)}
.st-confirmado{background:#DCE6F5;color:#2D4C80}
.st-enviado{background:#E8E1F4;color:#553D86}
.st-entregado{background:#D8EBDD;color:var(--ok)}
.st-cancelado{background:#ECECEC;color:#6c6c6c}
.paid{background:#D8EBDD;color:var(--ok)}
.unpaid{background:#FBF2CF;color:var(--warn)}

/* admin */
.adm-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:26px 0 6px}
.adm-h h1{font-size:44px;font-weight:800;font-stretch:75%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 20px;scrollbar-width:none;background:var(--stage);padding:4px;border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--stage);border-radius:20px;padding:18px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{display:block;font-weight:800;font-stretch:80%;font-size:34px;letter-spacing:-.02em;margin-top:6px}
.kpi:first-child{background:var(--green);color:#fff}.kpi:first-child span{color:#C9D6CE}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
.tbl th{font-size:13.5px;color:var(--muted);font-weight:600}
.tbl .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--stage)}
.tbl .th svg,.tbl .th img{width:100%;height:100%;object-fit:cover}
.tblwrap{overflow-x:auto}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.minisel{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:10px;font-size:14.5px;margin:10px 0}
.bar i{display:block;height:8px;border-radius:9px;background:var(--green)}
.bar .bw{flex:1;background:var(--stage);border-radius:9px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,30,25,.45)}
.modal .box{background:#fff;border-radius:24px;width:min(660px,100%);max-height:92vh;overflow:auto;padding:24px}
.modal .box.sm{width:min(400px,100%)}
.modal h3{font-size:30px;margin-bottom:16px}
.colrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.colrow input[type=text]{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.colrow input[type=color]{width:44px;height:40px;border:1.5px solid var(--line);border-radius:12px;padding:2px;background:#fff}
.imgprev{width:120px;height:120px;border-radius:14px;overflow:hidden;background:var(--stage)}
.imgprev svg,.imgprev img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{accent-color:var(--green)}

/* footer, toast */
footer.site{background:var(--green);color:#C9D6CE;margin-top:64px;padding:48px 0 26px;font-size:15px}
footer .fbrand{font-size:clamp(56px,10vw,140px);font-weight:800;font-stretch:75%;letter-spacing:-.04em;line-height:.85;color:#fff;margin:0 0 36px}

/* ================= Carrito ================= */
function saveCart(){ LS.set('cart', S.cart); updateBadges(); }
function addToCart(id, ci, qty){
  const p = byId(id); if(!p) return;
  const key = id+'|'+(ci||0);
  const line = S.cart.find(l=>l.key===key);
  const inCart = S.cart.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0);
  const stock = Number(p.stock)||0;
  if(inCart + qty > stock){ toast(stock ? `Solo quedan ${stock} unidades` : 'Sin stock por ahora'); return; }
  if(line) line.qty += qty; else S.cart.push({key, id, ci:ci||0, qty});
  saveCart(); renderCart(); openDrawer('cart');
}
function cartLines(){
  return S.cart.map(l => { const p = byId(l.id); if(!p || p.active===false) return null;
    const col = (p.colors||[])[l.ci] || {n:'', h:'#ccc'};
    return {...l, p, col, total:p.price*l.qty}; }).filter(Boolean);
}
function findCoupon(code){
  code = String(code||'').trim().toUpperCase(); if(!code) return null;
  return (cfg().coupons||[]).find(c => c.active !== false && String(c.code).toUpperCase() === code) || null;
}
function totals(form){
  const lines = cartLines();
  const sub = lines.reduce((a,l)=>a+l.total,0);
  const cp = findCoupon(S.coupon);
  let disc = 0;
  if(cp) disc = cp.type==='pct' ? Math.round(sub * Math.min(100,Number(cp.value)||0)/100) : Math.min(sub, Number(cp.value)||0);
  const after = sub - disc;
  const f = form || S.form; const c = cfg();
  let ship = 0, shipLabel = 'Retiro en showroom';
  if(f.delivery !== 'retiro'){
    if(after >= (Number(c.freeFrom)||Infinity) && Number(c.freeFrom)>0){ ship = 0; shipLabel = 'Envío gratis'; }
    else { ship = f.dept==='Montevideo' ? Number(c.shipMvd)||0 : Number(c.shipInt)||0; shipLabel = 'Envío a '+(f.dept||'domicilio'); }
  }
  const base = after + ship; let adj = 0, adjLabel = '';
  if(f.pay==='tarjeta' && Number(c.cardFee)>0){ adj = Math.round(base*Number(c.cardFee)/100); adjLabel = `Recargo tarjeta (${Number(c.cardFee)}%)`; }
  else if((f.pay==='transferencia'||f.pay==='efectivo') && Number(c.cashDisc)>0){ adj = -Math.round(base*Number(c.cashDisc)/100); adjLabel = `Descuento ${f.pay==='transferencia'?'transferencia':'efectivo'} (${Number(c.cashDisc)}%)`; }
  return {lines, sub, cp, disc, ship, shipLabel, adj, adjLabel, total: base + adj, count: lines.reduce((a,l)=>a+l.qty,0)};
}

function filtered(){
  const f = S.f; const q = f.q.trim().toLowerCase();
  let list = visible().filter(p =>
    (f.cat==='todas' || p.cat===f.cat) &&
    (!q || [p.name,p.material,catName(p.cat),p.desc].join(' ').toLowerCase().includes(q)) &&
    (!f.max || p.price <= f.max) &&
    (!f.mat || String(p.material||'').toLowerCase().includes(f.mat)));
  const s = f.sort;
  if(s==='precio-asc') list.sort((a,b)=>a.price-b.price);
  else if(s==='precio-desc') list.sort((a,b)=>b.price-a.price);
  else if(s==='nombre') list.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  else if(s==='ofertas') list.sort((a,b)=>((b.compare>b.price)-(a.compare>a.price)));
  else list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || (a.order||0)-(b.order||0));
  return list;

function validate(){
  const f = S.form, e = {};
  if(!f.name || f.name.trim().length < 3) e.name = 'Ingresá tu nombre completo';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email||'')) e.email = 'Email no válido';
  if(String(f.phone||'').replace(/\D/g,'').length < 8) e.phone = 'Ingresá un celular válido';
  if(f.delivery !== 'retiro'){
    if(!f.city || !f.city.trim()) e.city = 'Requerido';
    if(!f.addr || f.addr.trim().length < 5) e.addr = 'Ingresá la dirección';
  }
  S.errors = e; return !Object.keys(e).length;
}
function orderText(o){
  const L = [];
  L.push(`Hola! Quiero confirmar mi pedido *${o.id}*`, '');
  o.items.forEach(i => L.push(`• ${i.qty} × ${i.name} (${i.color}) — ${fmt(i.price*i.qty)}`));
  L.push('', `Subtotal: ${fmt(o.sub)}`);
  if(o.disc) L.push(`Descuento ${o.coupon}: −${fmt(o.disc)}`);
  L.push(`${o.shipLabel}: ${o.ship?fmt(o.ship):'Gratis'}`);
  if(o.adj) L.push(`${o.adjLabel}: ${o.adj<0?'−':'+'}${fmt(Math.abs(o.adj))}`);
  L.push(`*Total: ${fmt(o.total)}*`, '');
  L.push(`Nombre: ${o.customer.name}`, `Celular: ${o.customer.phone}`, `Email: ${o.customer.email}`);
  if(o.customer.doc) L.push(`CI: ${o.customer.doc}`);
  L.push(o.delivery==='retiro' ? 'Entrega: Retiro en showroom' : `Entrega: ${o.customer.addr}, ${o.customer.city}, ${o.customer.dept}`);
  if(o.customer.notes) L.push(`Notas: ${o.customer.notes}`);
  L.push(`Pago: ${PAYS[o.pay]}`);
  return L.join('\n');
}
async function placeOrder(){
  if(S.placing) return;
  if(!validate()){ render(); const el = document.querySelector('.bad'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const t = totals();
  // control de stock
  for(const l of t.lines){ const tot = t.lines.filter(x=>x.id===l.id).reduce((a,x)=>a+x.qty,0); if(tot > (Number(l.p.stock)||0)){ toast(`Stock insuficiente: ${l.p.name}`); return; } }
  S.placing = true; render();
  const f = S.form;
  const o = {
    id: 'NG-' + Date.now().toString(36).toUpperCase().slice(-6),
    createdAt: Date.now(), status:'nuevo', paid:false, stockApplied:false,
    items: t.lines.map(l=>({id:l.id, name:l.p.name, color:l.col.n, colorHex:l.col.h, type:l.p.type, qty:l.qty, price:l.p.price})),
    sub:t.sub, disc:t.disc, adj:t.adj||0, adjLabel:t.adjLabel||'', coupon: t.cp ? t.cp.code : '', ship:t.ship, shipLabel:t.shipLabel, total:t.total,
    delivery: f.delivery==='retiro' ? 'retiro' : 'envio', pay:f.pay,
    customer:{name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), doc:(f.doc||'').trim(),
      dept: f.delivery==='retiro'?'':f.dept, city: f.delivery==='retiro'?'':(f.city||'').trim(), addr: f.delivery==='retiro'?'':(f.addr||'').trim(), notes:(f.notes||'').trim()},
    history:[{s:'nuevo', t:Date.now()}]
  };
  let saved = false;
  if(S.db && S.uid){
    try{
      const ref = S.db.doc('orders/'+S.uid);
      const snap = await ref.get();
      const cur = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {orders:[]};
      cur.orders = (cur.orders||[]).concat([o]); cur.updatedAt = Date.now();
      await ref.set(cur); saved = true;
    }catch(err){ console.warn('No se pudo guardar el pedido', err); }
  }
  o.saved = saved;
  S.localOrders = [o, ...S.localOrders.filter(x=>x.id!==o.id)].slice(0,30); LS.set('orders', S.localOrders);
  LS.set('customer', {...S.form, notes:''});
  S.lastOrder = o; LS.set('lastOrder', o);
  S.cart = []; saveCart(); S.coupon=''; LS.set('coupon','');
  S.placing = false; S.errors = {};
  go('pedido-confirmado');
}

function admResumen(){
  const ords = S.allOrders.map(x=>x.o);
  const valid = ords.filter(o=>o.status!=='cancelado');
  const sales = valid.reduce((a,o)=>a+o.total,0);

function syncEditingFromForm(){
  const fm = $('#pform'); if(!fm) return;
  const fd = new FormData(fm); const p = S.editing;
  ['name','cat','type','dims','material','desc'].forEach(k=>p[k]=String(fd.get(k)||''));
  p.price = num(fd.get('price')); p.compare = num(fd.get('compare')); p.stock = Math.max(0, Math.round(num(fd.get('stock'))));
  p.featured = !!fd.get('featured'); p.active = !!fd.get('active');
  p.colors = (p.colors||[]).map((c,i)=>({ n: (fm.querySelector(`[data-cn="${i}"]`)||{}).value || c.n, h: (fm.querySelector(`[data-ci="${i}"]`)||{}).value || c.h }));
}
async function saveProduct(){
  syncEditingFromForm();
  const p = S.editing;
  if(!p.name.trim()){ toast('Poné un nombre'); return; }
  if(!(p.price>0)){ toast('Poné un precio válido'); return; }
  if(!p.colors.length) p.colors = [{n:'Único', h:'#C9B79C'}];
  if(!p.id){ p.id = 'p' + Date.now().toString(36); p.order = Math.max(0,...products().map(x=>x.order||0)) + 1; }
  if(!(await ensureDbCatalog())) return;
  try{ await S.db.doc('products/'+p.id).set(p); toast('Producto guardado'); closeModal(); }
  catch(e){ toast(e && e.code==='quota_exceeded' ? 'La base de datos está llena' : 'No se pudo guardar'); }
}
async function ensureDbCatalog(){
  if(!S.db){ toast('Sin conexión a la base de datos'); return false; }
  if(S.dbProducts && S.dbProducts.length) return true;
  return await seedCatalog(true);
}
async function seedCatalog(silent){
  if(!S.db){ toast('Sin conexión a la base de datos'); return false; }
  try{ for(const p of BASE_PRODUCTS){ await S.db.doc('products/'+p.id).set(p); } if(!silent) toast('Catálogo cargado'); return true; }
  catch(e){ toast('No se pudo cargar el catálogo'); return false; }
}
async function saveConfig(next){
  if(!S.db){ toast('Sin conexión a la base de datos'); return false; }
  try{ await S.db.doc('config/store').set(next); S.config = {...DEFAULT_CONFIG, ...next}; renderChrome(); return true; }
  catch(e){ toast('No se pudo guardar'); return false; }
}
const writeQ = {};
function queued(key, fn){ writeQ[key] = (writeQ[key]||Promise.resolve()).then(fn, fn); return writeQ[key]; }
async function adjustStock(id, delta){
  const p = byId(id); if(!p || !S.db) return;
  const ref = S.db.doc('products/'+id);
  const snap = await ref.get(); const cur = snap.exists ? Number(snap.data().stock)||0 : Number(p.stock)||0;
  if(snap.exists) await ref.update({stock: Math.max(0, cur + delta)});
}
async function updateOrder(docId, orderId, mut){
  return queued('o:'+docId, async ()=>{
    const ref = S.db.doc('orders/'+docId);
    const snap = await ref.get(); if(!snap.exists) return;
    const data = JSON.parse(JSON.stringify(snap.data()));
    const o = (data.orders||[]).find(x=>x.id===orderId); if(!o) return;
    await mut(o); data.updatedAt = Date.now();
    await ref.set(data);
  });
}
async function setStatus(docId, orderId, status){
  if(!(await ensureDbCatalog())) return;
  try{
    await updateOrder(docId, orderId, async o => {
      o.status = status; o.history = (o.history||[]).concat([{s:status,t:Date.now()}]);
      if(!o.stockApplied && ['confirmado','enviado','entregado'].includes(status)){ for(const i of o.items) await queued('p:'+i.id, ()=>adjustStock(i.id, -i.qty)); o.stockApplied = true; }
      if(o.stockApplied && status==='cancelado'){ for(const i of o.items) await queued('p:'+i.id, ()=>adjustStock(i.id, i.qty)); o.stockApplied = false; }
    });
    toast('Pedido actualizado');
  }catch(e){ toast('No se pudo actualizar el pedido'); }
}

function render(){
  const h = currentHash();
  document.body.classList.remove('has-sticky');
  let html;
  if(h==='inicio') html = viewHome();
  else if(h==='tienda'){ S.f.cat='todas'; html = viewShop(); }
  else if(h.startsWith('cat-')){ S.f.cat = h.slice(4); html = viewShop(); }
  else if(h.startsWith('p-')) html = viewProduct(h.slice(2));
  else if(h==='favoritos') html = viewFavs();
  else if(h==='checkout') html = viewCheckout();
  else if(h==='pedido-confirmado') html = viewSuccess();
  else if(h==='mis-pedidos') html = viewMyOrders();
  else if(h==='envios') html = viewShipping();
  else if(h==='admin') html = viewAdmin();
  else html = viewHome();
  $('#app').innerHTML = html;
  renderResults();
  renderChrome();
  if($('#cartdrawer').classList.contains('on')) renderCart();

let lastRoute = '';
window.addEventListener('hashchange', ()=>{
  const h = currentHash(); const base = h.split('-')[0];
  if(h.startsWith('p-') && h!==lastRoute) S.qty = 1;
  render(); if(h!==lastRoute) window.scrollTo(0,0); lastRoute = h; closeDrawers();

/* Re-render seguro ante cambios de datos (no pisa lo que el usuario está escribiendo) */
let rrT;
function softRender(){
  clearTimeout(rrT); rrT = setTimeout(()=>{
    const a = document.activeElement;
    const typing = a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName) && $('#app').contains(a);
    if(typing){ if(a.id==='q'){ renderResults(); renderChrome(); return; } return; }
    const y = window.scrollY; render(); window.scrollTo(0,y);
  }, 60);
}

/* ================= Eventos ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if(a==='mclose-bg'){ if(e.target===el) closeModal(); return; }
  if(['quickadd','add','fav','color','pqty','rm','cq','coupon','copyorder','clearf','tab','menu','cart','search','close','mclose','herocolor','heroadd','stk','pedit','pnew','pdel','seed','cpdel','opaid','coladd','colrm','imgrm'].includes(a) && el.tagName!=='A') e.preventDefault();
  if(a==='tab') e.preventDefault();
  switch(a){
    case 'menu': openDrawer('menu'); break;
    case 'cart': openDrawer('cart'); break;
    case 'close': closeDrawers(); break;
    case 'search': go('tienda'); setTimeout(()=>{ const q=$('#q'); if(q) q.focus(); }, 50); break;
    case 'quickadd': addToCart(id, 0, 1); break;
    case 'herocolor': { S.heroCi = Number(el.dataset.i); const st=$('#herostage'), pk=$('#heropick'); if(st) st.innerHTML = heroStage(); if(pk) pk.innerHTML = heroPick(); break; }
    case 'heroadd': { const p = heroProduct(); if(p) addToCart(p.id, S.heroCi||0, 1); break; }
    case 'add': addToCart(id, S.sel[id]||0, S.qty); break;
    case 'fav': { const i = S.favs.indexOf(id); if(i>=0) S.favs.splice(i,1); else { S.favs.push(id); toast('Guardado en favoritos'); } LS.set('favs', S.favs); softRender(); break; }
    case 'color': { S.sel[id] = Number(el.dataset.i); const y=window.scrollY; render(); window.scrollTo(0,y); break; }
    case 'pqty': { S.qty = Math.max(1, Math.min(99, S.qty + Number(el.dataset.d))); $('#pq').textContent = S.qty; break; }
    case 'rm': S.cart = S.cart.filter(l=>l.key!==el.dataset.k); saveCart(); renderCart(); if(currentHash()==='checkout') render(); break;
    case 'cq': { const l = S.cart.find(x=>x.key===el.dataset.k); if(!l) break; const p = byId(l.id); const nq = l.qty + Number(el.dataset.d);
      const others = S.cart.filter(x=>x.id===l.id && x.key!==l.key).reduce((s,x)=>s+x.qty,0);
      if(nq < 1){ S.cart = S.cart.filter(x=>x!==l); } else if(p && nq + others > (Number(p.stock)||0)){ toast('No hay más stock disponible'); break; } else l.qty = nq;
      saveCart(); renderCart(); if(currentHash()==='checkout') render(); break; }
    case 'coupon': { const v = ($('#cpin').value||'').trim().toUpperCase(); S.coupon = v; LS.set('coupon', v); toast(findCoupon(v)?'Cupón aplicado':'Cupón no válido'); render(); break; }
    case 'copyorder': { try{ await navigator.clipboard.writeText(orderText(S.lastOrder)); toast('Pedido copiado'); }catch(err){ toast('No se pudo copiar'); } break; }
    case 'clearf': S.f = {q:'', cat:S.f.cat, sort:'destacados', max:0, mat:''}; render(); break;
    case 'tab': S.adminTab = el.dataset.t; render(); break;
    case 'mclose': closeModal(); break;
    case 'pnew': openProductModal(null); break;
    case 'pedit': openProductModal(id); break;
    case 'seed': { el.disabled = true; if(await seedCatalog(false)) {} el.disabled = false; break; }
    case 'pdel': confirmBox('Se va a borrar "'+(byId(id)||{}).name+'" del catálogo.', async ()=>{ try{ await S.db.doc('products/'+id).delete(); toast('Producto borrado'); }catch(err){ toast('No se pudo borrar'); } }); break;
    case 'stk': { if(!(await ensureDbCatalog())) break; const p = byId(id); const v = Math.max(0,(Number(p.stock)||0)+Number(el.dataset.d));
      try{ await queued('p:'+id, ()=>S.db.doc('products/'+id).update({stock:v})); }catch(err){ toast('No se pudo actualizar'); } break; }
    case 'opaid': { const x = S.allOrders.find(x=>x.o.id===id); if(!x) break; try{ await updateOrder(el.dataset.doc, id, o=>{ o.paid = !o.paid; }); toast('Pago actualizado'); }catch(err){ toast('No se pudo actualizar'); } break; }
    case 'cpdel': { const cps = (cfg().coupons||[]).slice(); cps.splice(Number(el.dataset.i),1); if(await saveConfig({...cfg(), coupons:cps})) { toast('Cupón borrado'); render(); } break; }
    case 'coladd': syncEditingFromForm(); S.editing.colors.push({n:'', h:'#999999'}); drawProductModal(); break;
    case 'colrm': syncEditingFromForm(); S.editing.colors.splice(Number(el.dataset.i),1); drawProductModal(); break;
    case 'imgrm': syncEditingFromForm(); S.editing.image=''; drawProductModal(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='q'){ S.f.q = t.value; renderResults(); return; }
  if(t.id==='aq'){ S.adminQ = t.value; clearTimeout(t._t); t._t = setTimeout(()=>{ const el=$('#aorders'); if(!el) return; const tmp=document.createElement('div'); tmp.innerHTML=admPedidos(); el.innerHTML = tmp.querySelector('#aorders').innerHTML; }, 150); return; }
  const fm = t.closest('#coform');
  if(fm && t.name && t.type!=='radio'){ S.form[t.name] = t.value; if(S.errors[t.name]){ delete S.errors[t.name]; const lab=t.closest('.f'); if(lab){ lab.classList.remove('bad'); const er=lab.querySelector('.er'); if(er) er.remove(); } } }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.id==='fmax'){ S.f.max = Number(t.value); renderResults(); return; }
  if(t.id==='fmat'){ S.f.mat = t.value; renderResults(); return; }
  if(t.id==='fsort'){ S.f.sort = t.value; renderResults(); return; }
  if(t.id==='ast'){ S.adminStatus = t.value; render(); return; }
  const fm = t.closest('#coform');
  if(fm && t.name){
    S.form[t.name] = t.value;
    if(t.type==='radio' || t.name==='dept'){ const y=window.scrollY; render(); window.scrollTo(0,y); }
    return;
  }
  if(t.dataset.a==='ostatus'){ await setStatus(t.dataset.doc, t.dataset.id, t.value); return; }
  if(t.dataset.a==='pvis'){ try{ await S.db.doc('products/'+t.dataset.id).update({active:t.checked}); }catch(err){ toast('No se pudo actualizar'); t.checked=!t.checked; } return; }
  if(t.dataset.a==='cptog'){ const cps = JSON.parse(JSON.stringify(cfg().coupons||[])); cps[Number(t.dataset.i)].active = t.checked; await saveConfig({...cfg(), coupons:cps}); return; }
  if(t.id==='pimg' && t.files && t.files[0]){
    syncEditingFromForm();
    try{ S.editing.image = await resizeImage(t.files[0]); drawProductModal(); }catch(err){ toast('No se pudo leer la imagen'); }
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if(f.id==='coform'){ placeOrder(); return; }
  if(f.id==='pform'){ saveProduct(); return; }
  if(f.id==='cpform'){
    const fd = new FormData(f); const code = String(fd.get('code')||'').trim().toUpperCase().replace(/\s+/g,''); const value = num(fd.get('value'));
    if(!code || !(value>0)){ toast('Completá código y valor'); return; }
    const cps = (cfg().coupons||[]).filter(c=>String(c.code).toUpperCase()!==code).concat([{code, type:fd.get('type')==='fix'?'fix':'pct', value, active:true}]);
    if(await saveConfig({...cfg(), coupons:cps})){ toast('Cupón creado'); render(); }
    return;
  }
  if(f.id==='setform'){
    const fd = new FormData(f); const next = {...cfg()};
    ['storeName','tagline','whatsapp','phone','email','hours','address','warranty','bank'].forEach(k=>next[k]=String(fd.get(k)||'').trim());
    ['shipMvd','shipInt','freeFrom','cardFee','cashDisc'].forEach(k=>next[k]=Math.max(0,num(fd.get(k))));
    next.cardFee = Math.min(next.cardFee, 30); next.cashDisc = Math.min(next.cashDisc, 50);
    if(await saveConfig(next)){ toast('Ajustes guardados'); render(); }
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeDrawers(); closeModal(); } });
function resizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const max = 900; let w = img.width, h = img.height; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img,0,0,w,h);
        let q = .82, url = cv.toDataURL('image/jpeg', q); while(url.length > 190000 && q > .35){ q -= .1; url = cv.toDataURL('image/jpeg', q); }
        res(url); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ================= Versión publicada fuera de Claude: lee data/tienda.json ================= */
async function loadStatic(){
  try{
    const r = await fetch('data/tienda.json', {cache:'no-cache'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(Array.isArray(d.products) && d.products.length) S.dbProducts = d.products.map(p => ({...p, price:Number(p.price)||0, compare:Number(p.compare)||0, stock:Number(p.stock)||0, colors:Array.isArray(p.colors)?p.colors:[]}));
    if(d.config) S.config = {...DEFAULT_CONFIG, ...d.config};
    S.dbState = 'static';
  }catch(e){ S.dbState = 'offline'; }
  render();
}

/* ================= Conexión con la base de datos ================= */
async function connect(){
  if(!window.claude || typeof window.claude.use !== 'function'){ await loadStatic(); return; }
  const slow = setTimeout(()=>{ if(S.dbState==='connecting'){ S.dbState='slow'; renderChrome(); } }, 10000);
  let db=null, user=null;
  try{ [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
  S.db = db; S.user = user;
  if(user){
    try{ S.isAdmin = !!(await Promise.resolve(user.canEdit())); }catch(e){}
    try{ S.uid = await Promise.resolve(user.id()); }catch(e){}
  }
  if(!db){ clearTimeout(slow); S.dbState='offline'; render(); return; }
  const markLive = () => { if(S.dbState!=='live'){ S.dbState='live'; clearTimeout(slow); } };
  db.collection('products').onSnapshot(snap => {
    S.dbProducts = snap.docs.map(d => ({...d.data(), id:d.id}))
      .map(p => ({...p, price:Number(p.price)||0, compare:Number(p.compare)||0, stock:Number(p.stock)||0, colors:Array.isArray(p.colors)?p.colors:[]}));
    if(!snap.metadata.fromCache) markLive();
    softRender();
  }, err => { clearTimeout(slow); S.dbState = S.dbProducts ? 'live' : 'offline'; softRender(); });
  db.doc('config/store').onSnapshot(snap => {
    if(snap.exists) S.config = {...DEFAULT_CONFIG, ...snap.data()};
    softRender();
  }, ()=>{});
  if(S.uid){
    db.doc('orders/'+S.uid).onSnapshot(snap => {
      S.myOrders = snap.exists ? (snap.data().orders||[]) : [];
      softRender();
    }, ()=>{});
  }
  if(S.isAdmin){
    db.collection('orders').onSnapshot(snap => {
      const all = [];
      snap.docs.forEach(d => (d.data().orders||[]).forEach(o => all.push({doc:d.id, o})));
      all.sort((a,b)=>b.o.createdAt-a.o.createdAt);
      S.allOrders = all; softRender();
    }, ()=>{});
  }
  render();
}

lastRoute = currentHash();
render();
connect();
